services:
  suruga:
    image: suruga
    build:
      context: .
      dockerfile: Suruga/Dockerfile
    container_name: suruga-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/suruga.db
      INVIDIOUSCOMPANION_HOST: invidious-companion
    volumes:
      - suruga-data:/app/data
    depends_on:
      invidious-companion:
        condition: service_started

  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: suruga-invidious-companion
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: ${INVIDIOUSCOMPANION_SECRETKEY}
    volumes:
      - invidious_companion-cache:/var/tmp/youtubei.js

volumes:
  suruga-data:
  invidious_companion-cache:
